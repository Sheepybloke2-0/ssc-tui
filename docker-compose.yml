services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssc-tui-dev
    volumes:
      - .:/workspace
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/workspace/target
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: /bin/bash

volumes:
  cargo-cache:
  target-cache:
